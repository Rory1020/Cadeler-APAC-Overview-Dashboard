name: Update dashboard news
on:
  schedule: [{cron: "0 22 * * *"}]   # 06:00 Taipei time daily
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python scripts/update_news.py
      - run: |
          git config user.name "dashboard-bot"; git config user.email "bot@users.noreply.github.com"
          git add data/news.js; git diff --cached --quiet || (git commit -m "Daily news update" && git push)
