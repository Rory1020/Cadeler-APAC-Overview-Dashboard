name: Update dashboard
on:
  schedule: [{cron: "0 22 * * *"}]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install websockets
      - run: python scripts/update_news.py
      - run: python scripts/update_data.py
        continue-on-error: true
        env: {ANTHROPIC_API_KEY: "${{ secrets.ANTHROPIC_API_KEY }}"}
      - run: python scripts/update_vessels.py
        continue-on-error: true
        env: {AISSTREAM_API_KEY: "${{ secrets.AISSTREAM_API_KEY }}"}
      - run: |
          git config user.name "dashboard-bot"; git config user.email "bot@users.noreply.github.com"
          git add data; git diff --cached --quiet || (git commit -m "Daily dashboard update" && git push)
